<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Айжан — официальный центр обиды</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffb6d9,#ffdce9,#fff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card{
background:white;
padding:40px;
width:420px;
border-radius:30px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.15);
animation:float 3s infinite ease-in-out;
}

h1{
font-size:40px;
margin-bottom:10px;
color:#ff4f9a;
}

.subtitle{
color:gray;
margin-bottom:30px;
}

.reason{
background:#fff5f9;
padding:15px;
margin:12px 0;
border-radius:15px;
font-size:18px;
transition:.3s;
}

.reason:hover{
transform:scale(1.05);
background:#ffd5e7;
}

button{
margin-top:20px;
padding:15px 30px;
border:none;
border-radius:20px;
background:#ff4f9a;
color:white;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#ff2e84;
}

#status{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#ff4f9a;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">

<h1>💔 Айжамал</h1>

<p class="subtitle">

</p>

<div class="reason">
❌ Не ответили сразу
</div>

<div class="reason">
👀 Посмотрели не так
</div>

<div class="reason">
😔 Существование людей
</div>

<button onclick="sad()">
Узнать уровень обиды
</button>

<div id="status"></div>

</div>

<script>

function sad(){

let texts=[
"Обида: 87% 💔",
"Сегодня уровень: максимальный 😔",
"Причина: воздух существовал",
"Настроение: запомнила всё 😭",
"Режим: игнор до 2040 года"
];

let random=
texts[Math.floor(Math.random()*texts.length)];

document.getElementById("status")
.innerHTML=random;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Спаси меня!</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffd6e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      background: linear-gradient(180deg, #ffb6c1 0%, #ffe4e1 100%);
      overflow: hidden;
    }
    /* Шапка со статусом */
    .header {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 15px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .score-box {
      font-weight: bold;
      color: #ff4757;
      font-size: 16px;
    }
    .hp-bar-bg {
      width: 120px;
      height: 16px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #fff;
    }
    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ff6b81);
      transition: width 0.2s;
    }

    /* Замок и Парень */
    .tower {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
    }
    .guy {
      font-size: 50px;
      animation: float 2s infinite ease-in-out;
    }
    .bubble {
      background: white;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Холст игры */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Оверлеи (Старт / Конец) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 182, 193, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    .overlay h1 {
      color: #d63031;
      margin-bottom: 15px;
      font-size: 24px;
    }
    .overlay p {
      color: #2d3436;
      margin-bottom: 25px;
      font-size: 16px;
      line-height: 1.4;
    }
    .btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Верхняя панель -->
  <div class="header">
    <div class="score-box">✨ Очки: <span id="score">0</span></div>
    <div style="text-align: right;">
      <div style="font-size: 10px; color: #555; margin-bottom: 2px;">Моя Жизнь</div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp"></div></div>
    </div>
  </div>

  <!-- Башня с парнем -->
  <div class="tower">
    <div class="bubble" id="guy-bubble">Спаси меня! ❤️</div>
    <div class="guy" id="guy-emoji">🤴</div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Экран старта -->
  <div class="overlay" id="start-screen">
    <h1>Спаси меня!❤️</h1>
    <p>Я попал в заточение дракона!<br>Лови сердечки, чтобы восстанавливать мою жизнь.<br>Чем больше очков ты наберешь, тем дольше я живу!</p>
    <button class="btn" onclick="startGame()">Спасти!</button>
  </div>

  <!-- Экран поражения -->
  <div class="overlay" id="game-over-screen" style="display: none;">
    <h1>Упппс! 💔</h1>
    <p id="final-stats">Запас любви закончился...</p>
    <button class="btn" onclick="startGame()">Попробовать снова 💖</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) tg.expand();

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = canvas.clientWidth;
    height = canvas.height = canvas.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Состояние игры
  let score = 0;
  let hp = 100;
  let isPlaying = false;
  let items = [];
  let spawnTimer = 0;

  // Игрок (Девушка)
  const player = {
    x: 0,
    y: 0,
    width: 60,
    height: 60,
    speed: 0,
    emoji: "👸"
  };

  // Фразы парня в зависимости от здоровья
  function updateGuyStatus() {
    const bubble = document.getElementById('guy-bubble');
    const guy = document.getElementById('guy-emoji');

    if (hp > 70) {
      bubble.innerText = "Я живу благодаря тебе! 🥰";
      guy.innerText = "🤴";
    } else if (hp > 30) {
      bubble.innerText = "Лови быстрее сердечки! 🥺";
      guy.innerText = "😰";
    } else {
      bubble.innerText = "Мне плохо, спасай! 💔";
      guy.innerText = "😵";
    }
  }

  function startGame() {
    score = 0;
    hp = 100;
    items = [];
    isPlaying = true;
    player.x = width / 2 - player.width / 2;
    player.y = height - 80;

    document.getElementById('score').innerText = score;
    document.getElementById('hp').style.width = '100%';
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';

    updateGuyStatus();
    requestAnimationFrame(gameLoop);
  }

  // Спавн падающих сердечек
  function spawnItem() {
    const types = [
      { emoji: "❤️", points: 10, hp: 5, speed: 3 },
      { emoji: "💖", points: 20, hp: 10, speed: 4 },
      { emoji: "🍓", points: 15, hp: 8, speed: 3.5 },
      { emoji: "💣", points: 0, hp: -20, speed: 4 } // Бомба / препятствие
    ];

    // Бомбы выпадают реже
    const rand = Math.random();
    let type = types[0];
    if (rand > 0.85) type = types[3];
    else if (rand > 0.6) type = types[1];
    else if (rand > 0.4) type = types[2];

    items.push({
      x: Math.random() * (width - 40),
      y: 120,
      size: 35,
      ...type
    });
  }

  // Управление (касания экрана)
  let touchStartX = null;
  window.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });

  window.addEventListener('touchmove', (e) => {
    if (!isPlaying || !touchStartX) return;
    const touchX = e.touches[0].clientX;
    const diff = touchX - touchStartX;
    player.x += diff * 1.5;
    
    // Ограничения границ
    if (player.x < 0) player.x = 0;
    if (player.x > width - player.width) player.x = width - player.width;

    touchStartX = touchX;
  });

  // Управление с клавиатуры (для тестов на ПК)
  const keys = {};
  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);

  function update() {
    if (!isPlaying) return;

    // Движение с ПК
    if (keys['ArrowLeft'] && player.x > 0) player.x -= 7;
    if (keys['ArrowRight'] && player.x < width - player.width) player.x += 7;

    // Трата жизней со временем (чем больше очков, тем чуть быстрее тратится)
    hp -= 0.08 + (score / 5000);
    if (hp <= 0) {
      hp = 0;
      gameOver();
    }
    document.getElementById('hp').style.width = hp + '%';
    updateGuyStatus();

    // Генерация элементов
    spawnTimer++;
    if (spawnTimer > 35) {
      spawnItem();
      spawnTimer = 0;
    }

    // Движение предметов
    for (let i = items.length - 1; i >= 0; i--) {
      let it = items[i];
      it.y += it.speed;

      // Столкновение с принцессой
      if (
        it.x < player.x + player.width &&
        it.x + it.size > player.x &&
        it.y < player.y + player.height &&
        it.y + it.size > player.y
      ) {
        score += it.points;
        hp = Math.min(100, hp + it.hp);
        document.getElementById('score').innerText = score;
        items.splice(i, 1);
        continue;
      }

      // Если сердечко упало мимо
      if (it.y > height) {
        if (it.emoji !== "💣") {
          hp -= 5; // Штраф за пропущенное сердечко
        }
        items.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    if (!isPlaying) return;

    // Рисуем принцессу
    ctx.font = "48px serif";
    ctx.fillText(player.emoji, player.x, player.y + 45);

    // Рисуем предметы
    for (let it of items) {
      ctx.font = "30px serif";
      ctx.fillText(it.emoji, it.x, it.y);
    }
  }

  function gameLoop() {
    if (!isPlaying) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function gameOver() {
    isPlaying = false;
    document.getElementById('final-stats').innerHTML = 
      `Ты набрала <b>${score}</b> очков!<br>` + 
      (score > 300 ? "Ты спасла меня, моя Салтошым! ❤️" : "Мне почти хватило твоей любви! Давай еще раз? 🥺");
    document.getElementById('game-over-screen').style.display = 'flex';

    // Отправляем результат в бот (если нужно)
    if (tg && tg.sendData) {
      // tg.sendData(JSON.stringify({ score: score }));
    }
  }
</script>
</body>
</html>

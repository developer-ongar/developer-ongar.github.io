<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Ввод анализов</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg: var(--tg-theme-secondary-bg-color, #f0f0f2);
            --card-bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --accent: var(--tg-theme-button-color, #2481cc);
            --border: rgba(60, 60, 67, 0.12);
            --dot-active: #34c759;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                'SF Pro Text',
                Roboto,
                sans-serif;

            background: var(--bg);
            color: var(--text);

            margin: 0;
            padding: 16px 12px 32px 12px;
        }

        .header {
            margin: 0 0 16px 8px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;

            margin: 0 0 2px 0;

            letter-spacing: -0.4px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint);

            margin: 0;
        }

        .section-header {
            font-size: 12px;
            font-weight: 500;

            text-transform: uppercase;

            color: var(--hint);

            margin: 18px 0 6px 12px;

            letter-spacing: 0.2px;
        }

        .group-card {
            background: var(--card-bg);

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 0.5px 1px rgba(0, 0, 0, 0.04);
        }

        .row {
            display: flex;

            flex-direction: column;

            padding: 10px 12px;

            position: relative;

            gap: 8px;
        }

        .row:not(:last-child)::after {
            content: '';

            position: absolute;

            bottom: 0;
            right: 0;
            left: 12px;

            height: 0.5px;

            background: var(--border);
        }

        .row-header {
            display: flex;

            align-items: center;

            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: transparent;

            transition:
                background 0.2s ease;
        }

        .row.filled .status-dot {
            background: var(--dot-active);
        }

        .label {
            font-size: 14px;

            font-weight: 600;
        }

        .inputs-primary {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 6px;
        }

        /*
         * Дополнительные поля теперь формируются
         * динамически.
         *
         * Если 1 поле:
         *    1 колонка
         *
         * Если 2 поля:
         *    2 колонки
         *
         * Если 3 поля:
         *    3 колонки
         *
         * Если 4 поля:
         *    4 колонки
         */
        .inputs-secondary {
            display: grid;

            gap: 4px;
        }

        .inputs-secondary.fields-1 {
            grid-template-columns: 1fr;
        }

        .inputs-secondary.fields-2 {
            grid-template-columns: 1fr 1fr;
        }

        .inputs-secondary.fields-3 {
            grid-template-columns:
                1fr 1fr 1fr;
        }

        .inputs-secondary.fields-4 {
            grid-template-columns:
                1fr 1fr 1fr 1fr;
        }

        input {
            width: 100%;

            padding: 6px 4px;

            background: var(--bg);

            color: var(--text);

            border: none;

            border-radius: 6px;

            font-size: 13px;

            font-weight: 500;

            text-align: center;

            outline: none;

            transition:
                background 0.2s;
        }

        input:focus {
            background:
                rgba(36, 129, 204, 0.15);
        }

        input::placeholder {
            color: var(--hint);

            font-weight: 400;

            font-size: 11px;

            opacity: 0.7;
        }

        /*
         * На маленьких экранах 4 поля
         * автоматически могут перейти
         * на 2 колонки.
         */
        @media (max-width: 360px) {

            .inputs-secondary.fields-4 {
                grid-template-columns:
                    1fr 1fr;
            }

            .inputs-secondary.fields-3 {
                grid-template-columns:
                    1fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>
            Данные анализов
        </h1>

        <p id="page-subtitle">
            Введите показания параметров
        </p>

    </div>


    <div id="table"></div>


    <script>

        // =========================================================
        // TELEGRAM WEB APP
        // =========================================================

        const tg =
            window.Telegram?.WebApp;


        if (tg) {

            tg.expand();

            tg.MainButton.setText(
                "СОХРАНИТЬ И ОТПРАВИТЬ"
            );

            tg.MainButton.onClick(
                () => sendData()
            );
        }


        // =========================================================
        // ПОЛУЧЕНИЕ ПАРАМЕТРОВ ИЗ URL
        // =========================================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const currentBlock =
            urlParams.get('block') ||
            'БВО-1';


        const currentTime =
            urlParams.get('time') ||
            '09:00';


        // =========================================================
        // ПОЛНЫЙ АНАЛИЗ
        // =========================================================

        const isFullAnalysisTime =
            currentTime === '09:00' ||
            currentTime === '21:00';


        // =========================================================
        // ОПРЕДЕЛЕНИЕ БВО
        // =========================================================

        const isBvo1 =
            currentBlock
                .toUpperCase()
                .includes('БВО-1');


        document
            .getElementById('page-subtitle')
            .innerText =
                `Блок: ${currentBlock} | Время: ${currentTime}`;


        // =========================================================
        // ФИЛЬТРЫ
        // =========================================================

        const filterCount =
            isBvo1 ? 8 : 12;


        const filterItems =
            Array.from(
                {
                    length: filterCount
                },
                (_, i) =>
                    `Фильтр ${i + 1}`
            );


        // =========================================================
        // ГРУППЫ
        // =========================================================

        const groups = [];


        // ---------------------------------------------------------
        // НАСОСЫ — ТОЛЬКО БВО-1
        // ---------------------------------------------------------

        if (isBvo1) {

            groups.push({

                title: "Насосы",

                items: [
                    "Насос 1",
                    "Насос 2",
                    "Насос 3",
                    "Насос 4",
                    "Насос 5",
                    "Насос 6"
                ]
            });
        }


        // ---------------------------------------------------------
        // УПРАВЛЕНИЕ И КОЛЛЕКТОРЫ
        // ---------------------------------------------------------

        groups.push({

            title:
                "Управление и коллекторы",

            items: [
                "УФО 1",
                "УФО 2",
                "КЧВ",
                "КФВ",
                "Общий коллектор",
                "После смесителя",
                "Исх. вода",
                "Оборотная вода"
            ]
        });


        // ---------------------------------------------------------
        // ФИЛЬТРЫ
        // ---------------------------------------------------------

        groups.push({

            title: "Фильтры",

            items: filterItems
        });


        // =========================================================
        // КОНТЕЙНЕР
        // =========================================================

        const container =
            document.getElementById('table');


        let globalIndex = 0;


        const allPoints = [];


        // =========================================================
        // ДОПОЛНИТЕЛЬНЫЕ ПОЛЯ ДЛЯ КАЖДОЙ ТОЧКИ
        // =========================================================
        //
        // ВАЖНО:
        //
        // Эта функция теперь используется
        // НЕ ТОЛЬКО для отправки данных.
        //
        // Она определяет, какие поля реально
        // будут показаны на экране.
        //
        // =========================================================

        function getActiveFieldsForPoint(ptName) {


            // -----------------------------------------------------
            // В обычное время дополнительные показатели
            // вообще отсутствуют.
            //
            // Остаются только:
            //
            // Хлор
            // Мутность
            // -----------------------------------------------------

            if (!isFullAnalysisTime) {

                return [
                    'cl',
                    'turb'
                ];
            }


            // -----------------------------------------------------
            // ФИЛЬТРЫ
            //
            // Даже в 09:00 и 21:00:
            //
            // Хлор
            // Мутность
            // -----------------------------------------------------

            if (
                ptName
                    .toLowerCase()
                    .startsWith('фильтр')
            ) {

                return [
                    'cl',
                    'turb'
                ];
            }


            // -----------------------------------------------------
            // КФВ
            //
            // Хлор
            // Мутность
            // pH
            // -----------------------------------------------------

            if (ptName === "КФВ") {

                return [
                    'cl',
                    'turb',
                    'ph'
                ];
            }


            // -----------------------------------------------------
            // ОБЩИЙ КОЛЛЕКТОР
            //
            // Хлор
            // Мутность
            // pH
            // Щелочность
            // -----------------------------------------------------

            if (
                ptName ===
                "Общий коллектор"
            ) {

                return [
                    'cl',
                    'turb',
                    'ph',
                    'alk'
                ];
            }


            // -----------------------------------------------------
            // ПОСЛЕ СМЕСИТЕЛЯ
            //
            // Хлор
            // Мутность
            // pH
            // Щелочность
            // Окисляемость
            // -----------------------------------------------------

            if (
                ptName ===
                "После смесителя"
            ) {

                return [
                    'cl',
                    'turb',
                    'ph',
                    'alk',
                    'ox'
                ];
            }


            // -----------------------------------------------------
            // ИСХОДНАЯ ВОДА
            //
            // Хлор
            // Мутность
            // pH
            // Щелочность
            // Окисляемость
            // -----------------------------------------------------

            if (
                ptName ===
                "Исх. вода"
            ) {

                return [
                    'cl',
                    'turb',
                    'ph',
                    'alk',
                    'ox'
                ];
            }


            // -----------------------------------------------------
            // ОБОРОТНАЯ ВОДА
            //
            // Хлор
            // Мутность
            // Al
            // -----------------------------------------------------

            if (
                ptName ===
                "Оборотная вода"
            ) {

                return [
                    'cl',
                    'turb',
                    'al'
                ];
            }


            // -----------------------------------------------------
            // ВСЕ ОСТАЛЬНЫЕ:
            //
            // УФО 1
            // УФО 2
            // КЧВ
            // Насосы
            //
            // Хлор
            // Мутность
            // pH
            // Щелочность
            // Al
            // Окисляемость
            // -----------------------------------------------------

            return [
                'cl',
                'turb',
                'ph',
                'alk',
                'al',
                'ox'
            ];
        }


        // =========================================================
        // НАЗВАНИЯ ПОЛЕЙ
        // =========================================================

        const fieldLabels = {

            cl: "Хлор (Cl)",

            turb: "Мутность",

            ph: "pH",

            alk: "Щел.",

            al: "Al",

            ox: "Окисл."
        };


        // =========================================================
        // СОЗДАНИЕ INPUT
        // =========================================================

        function createInput(
            field,
            index,
            point
        ) {

            const input =
                document.createElement('input');


            input.type = 'text';

            input.inputMode = 'decimal';


            input.id =
                `${field}_${index}`;


            input.placeholder =
                fieldLabels[field];


            input.value =
                localStorage.getItem(
                    `${currentBlock}_${currentTime}_${field}_${point}`
                ) || '';


            input.addEventListener(
                'input',
                () => {

                    checkState(
                        index,
                        point
                    );
                }
            );


            return input;
        }


        // =========================================================
        // СОЗДАНИЕ СТРОК
        // =========================================================

        groups.forEach(group => {


            // Заголовок группы
            const groupHeader =
                document.createElement(
                    'div'
                );


            groupHeader.className =
                'section-header';


            groupHeader.innerText =
                group.title;


            container.appendChild(
                groupHeader
            );


            // Карточка группы
            const groupCard =
                document.createElement(
                    'div'
                );


            groupCard.className =
                'group-card';


            // Точки
            group.items.forEach(pt => {


                const index =
                    globalIndex++;


                allPoints.push(pt);


                // Получаем РЕАЛЬНЫЕ поля
                // для этой конкретной точки
                const activeFields =
                    getActiveFieldsForPoint(
                        pt
                    );


                // -------------------------------------------------
                // ROW
                // -------------------------------------------------

                const row =
                    document.createElement(
                        'div'
                    );


                row.className =
                    'row';


                row.id =
                    `row_${index}`;


                // -------------------------------------------------
                // Заголовок
                // -------------------------------------------------

                const rowHeader =
                    document.createElement(
                        'div'
                    );


                rowHeader.className =
                    'row-header';


                const statusDot =
                    document.createElement(
                        'div'
                    );


                statusDot.className =
                    'status-dot';


                const label =
                    document.createElement(
                        'div'
                    );


                label.className =
                    'label';


                label.innerText =
                    pt;


                rowHeader.appendChild(
                    statusDot
                );


                rowHeader.appendChild(
                    label
                );


                row.appendChild(
                    rowHeader
                );


                // -------------------------------------------------
                // Основные показатели
                //
                // Они ВСЕГДА:
                //
                // Хлор
                // Мутность
                // -------------------------------------------------

                const primary =
                    document.createElement(
                        'div'
                    );


                primary.className =
                    'inputs-primary';


                const clInput =
                    createInput(
                        'cl',
                        index,
                        pt
                    );


                const turbInput =
                    createInput(
                        'turb',
                        index,
                        pt
                    );


                primary.appendChild(
                    clInput
                );


                primary.appendChild(
                    turbInput
                );


                row.appendChild(
                    primary
                );


                // -------------------------------------------------
                // ДОПОЛНИТЕЛЬНЫЕ ПОКАЗАТЕЛИ
                // -------------------------------------------------
                //
                // ВАЖНО:
                // здесь добавляются ТОЛЬКО нужные поля.
                //
                // Например КФВ:
                //
                // pH
                //
                // А НЕ:
                //
                // pH | Щел. | Al | Окисл.
                // -------------------------------------------------

                const secondaryFields =
                    activeFields.filter(
                        field =>
                            field !== 'cl' &&
                            field !== 'turb'
                    );


                if (
                    secondaryFields.length > 0
                ) {

                    const secondary =
                        document.createElement(
                            'div'
                        );


                    secondary.className =
                        `inputs-secondary fields-${secondaryFields.length}`;


                    secondaryFields.forEach(
                        field => {

                            const input =
                                createInput(
                                    field,
                                    index,
                                    pt
                                );


                            secondary.appendChild(
                                input
                            );
                        }
                    );


                    row.appendChild(
                        secondary
                    );
                }


                groupCard.appendChild(
                    row
                );
            });


            container.appendChild(
                groupCard
            );
        });


        // =========================================================
        // ПРОВЕРКА СОСТОЯНИЯ ПОСЛЕ ЗАГРУЗКИ
        // =========================================================

        allPoints.forEach(
            (pt, index) => {

                checkState(
                    index,
                    pt
                );
            }
        );


        // =========================================================
        // ALERT
        // =========================================================

        function showAlert(message) {

            if (
                tg &&
                tg.showAlert
            ) {

                tg.showAlert(
                    message
                );

            } else {

                alert(message);
            }
        }


        // =========================================================
        // ПРОВЕРКА ЗАПОЛНЕННОСТИ
        // =========================================================

        function checkState(
            index,
            ptName
        ) {

            const activeFields =
                getActiveFieldsForPoint(
                    ptName
                );


            const vals = {};


            activeFields.forEach(
                field => {

                    const el =
                        document.getElementById(
                            `${field}_${index}`
                        );


                    vals[field] =
                        el
                            ? el.value.trim()
                            : '';


                    if (ptName) {

                        localStorage.setItem(
                            `${currentBlock}_${currentTime}_${field}_${ptName}`,
                            vals[field]
                        );
                    }
                }
            );


            const row =
                document.getElementById(
                    `row_${index}`
                );


            const isFilled =
                Object.values(vals)
                    .some(
                        value =>
                            value !== ''
                    );


            if (isFilled) {

                row.classList.add(
                    'filled'
                );

            } else {

                row.classList.remove(
                    'filled'
                );
            }


            // -----------------------------------------------------
            // Проверяем, есть ли хотя бы
            // одно заполненное поле
            // -----------------------------------------------------

            const hasAnyData =
                allPoints.some(
                    (pName, i) => {

                        const fields =
                            getActiveFieldsForPoint(
                                pName
                            );


                        return fields.some(
                            field => {

                                const el =
                                    document.getElementById(
                                        `${field}_${i}`
                                    );


                                return (
                                    el &&
                                    el.value.trim() !== ''
                                );
                            }
                        );
                    }
                );


            if (tg) {

                if (hasAnyData) {

                    tg.MainButton.show();

                } else {

                    tg.MainButton.hide();
                }
            }
        }


        // =========================================================
        // ПРОВЕРКА ХЛОРА
        // =========================================================

        function validateChlorine(
            val
        ) {

            if (!val) {

                return {
                    valid: true
                };
            }


            const str =
                val.replace(
                    ',',
                    '.'
                );


            const regex =
                /^(0|[1-9]\d*)\.\d{2}$/;


            if (!regex.test(str)) {

                return {

                    valid: false,

                    reason:
                        "формат должен быть с двумя знаками (например: 0.22 или 1.98)"
                };
            }


            const lastDigit =
                parseInt(
                    str.slice(-1),
                    10
                );


            if (
                lastDigit % 2 !== 0
            ) {

                return {

                    valid: false,

                    reason:
                        "значение хлора должно быть чётным (например: 0.22 вместо 0.21)"
                };
            }


            return {
                valid: true
            };
        }


        // =========================================================
        // ПРОВЕРКА МУТНОСТИ
        // =========================================================

        function validateTurbidity(
            val
        ) {

            if (!val) {

                return {
                    valid: true
                };
            }


            const str =
                val.replace(
                    ',',
                    '.'
                );


            const regex =
                /^(0|[1-9]\d*)\.\d{1}$/;


            if (!regex.test(str)) {

                return {

                    valid: false,

                    reason:
                        "формат должен быть с одним знаком после точки (например: 2.1, 0.9)"
                };
            }


            return {
                valid: true
            };
        }


        // =========================================================
        // ОТПРАВКА ДАННЫХ
        // =========================================================

        function sendData() {

            const result = [];


            const allStorageFields = [

                'cl',

                'turb',

                'ph',

                'alk',

                'al',

                'ox'
            ];


            // -----------------------------------------------------
            // Перебираем все точки
            // -----------------------------------------------------

            for (
                let index = 0;
                index < allPoints.length;
                index++
            ) {


                const pt =
                    allPoints[index];


                const activeFields =
                    getActiveFieldsForPoint(
                        pt
                    );


                // -------------------------------------------------
                // Получаем значения
                // -------------------------------------------------

                const values = {};


                activeFields.forEach(
                    field => {

                        const el =
                            document.getElementById(
                                `${field}_${index}`
                            );


                        values[field] =
                            el
                                ? el.value.trim()
                                : '';
                    }
                );


                // -------------------------------------------------
                // Проверяем, есть ли данные
                // -------------------------------------------------

                const hasRowData =
                    Object.values(values)
                        .some(
                            value =>
                                value !== ''
                        );


                if (!hasRowData) {
                    continue;
                }


                // -------------------------------------------------
                // Проверка хлора
                // -------------------------------------------------

                const cl =
                    values.cl || '';


                const clCheck =
                    validateChlorine(
                        cl
                    );


                if (!clCheck.valid) {

                    showAlert(
                        `Ошибка в "${pt}" (Хлор "${cl}"): ${clCheck.reason}.`
                    );

                    return;
                }


                // -------------------------------------------------
                // Проверка мутности
                // -------------------------------------------------

                const turb =
                    values.turb || '';


                const turbCheck =
                    validateTurbidity(
                        turb
                    );


                if (!turbCheck.valid) {

                    showAlert(
                        `Ошибка в "${pt}" (Мутность "${turb}"): ${turbCheck.reason}.`
                    );

                    return;
                }


                // -------------------------------------------------
                // Создаём объект
                // -------------------------------------------------

                const itemData = {

                    point: pt,

                    chlorine:
                        cl,

                    turbidity:
                        turb
                };


                // -------------------------------------------------
                // Добавляем ТОЛЬКО существующие поля
                // -------------------------------------------------

                if (
                    activeFields.includes(
                        'ph'
                    )
                ) {

                    itemData.ph =
                        values.ph || '';
                }


                if (
                    activeFields.includes(
                        'alk'
                    )
                ) {

                    itemData.alkalinity =
                        values.alk || '';
                }


                if (
                    activeFields.includes(
                        'al'
                    )
                ) {

                    itemData.aluminum =
                        values.al || '';
                }


                if (
                    activeFields.includes(
                        'ox'
                    )
                ) {

                    itemData.oxidizability =
                        values.ox || '';
                }


                result.push(
                    itemData
                );
            }


            // =====================================================
            // ЕСЛИ НИЧЕГО НЕ ВВЕДЕНО
            // =====================================================

            if (
                result.length === 0
            ) {

                showAlert(
                    "Заполните хотя бы одно поле перед отправкой!"
                );

                return;
            }


            // =====================================================
            // ОЧИСТКА LOCAL STORAGE
            // =====================================================

            allPoints.forEach(
                pt => {

                    allStorageFields.forEach(
                        field => {

                            localStorage.removeItem(
                                `${currentBlock}_${currentTime}_${field}_${pt}`
                            );
                        }
                    );
                }
            );


            // =====================================================
            // ОТПРАВКА В TELEGRAM
            // =====================================================

            if (tg) {

                tg.sendData(
                    JSON.stringify(
                        result
                    )
                );
            }
        }

    </script>

</body>
</html>

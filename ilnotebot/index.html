<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ввод анализов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-secondary-bg-color, #f0f0f2);
            --card-bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --accent: var(--tg-theme-button-color, #2481cc);
            --border: rgba(60, 60, 67, 0.12);
            --dot-active: #34c759;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px 12px 32px 12px;
        }

        .header {
            margin: 0 0 16px 8px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 2px 0;
            letter-spacing: -0.4px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint);
            margin: 0;
        }

        .section-header {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--hint);
            margin: 18px 0 6px 12px;
            letter-spacing: 0.2px;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.04);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            position: relative;
        }

        .row:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            left: 12px;
            height: 0.5px;
            background: var(--border);
        }

        .label-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 45%;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: transparent;
            transition: background 0.2s ease;
        }

        .row.filled .status-dot {
            background: var(--dot-active);
        }

        .label {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .inputs {
            display: flex;
            gap: 6px;
            width: 52%;
        }

        input {
            width: 100%;
            padding: 6px 4px;
            background: var(--bg);
            color: var(--text);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: background 0.2s;
        }

        input:focus {
            background: rgba(36, 129, 204, 0.1);
        }

        input::placeholder {
            color: var(--hint);
            font-weight: 400;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="page-title">Данные анализов</h1>
        <p id="page-subtitle">Введите показания параметров</p>
    </div>

    <div id="table"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.MainButton.setText("СОХРАНИТЬ И ОТПРАВИТЬ");
            tg.MainButton.onClick(() => sendData());
        }

        // Получаем параметры блока и времени из URL (переданные из bot.py)
        const urlParams = new URLSearchParams(window.location.search);
        const currentBlock = urlParams.get('block') || 'БВО-1';
        const currentTime = urlParams.get('time') || '09:00';

        // Обновляем подзаголовок, чтобы лаборант видел, куда вводит данные
        document.getElementById('page-subtitle').innerText = `Блок: ${currentBlock} | Время: ${currentTime}`;

        const groups = [
            {
                title: "Насосы",
                items: ["Насос 1", "Насос 2", "Насос 3", "Насос 4", "Насос 5", "Насос 6"]
            },
            {
                title: "Управление и коллекторы",
                items: ["УФО 1", "УФО 2", "КЧВ", "КФВ", "Общий коллектор", "После смесителя", "Исх. вода", "Оборотная вода"]
            },
            {
                title: "Фильтры",
                items: [
                    "Фильтр 1", "Фильтр 2", "Фильтр 3", "Фильтр 4", "Фильтр 5", "Фильтр 6",
                    "Фильтр 7", "Фильтр 8", "Фильтр 9", "Фильтр 10", "Фильтр 11", "Фильтр 12"
                ]
            }
        ];

        const container = document.getElementById('table');
        let globalIndex = 0;
        const allPoints = [];

        groups.forEach(group => {
            const groupHeader = document.createElement('div');
            groupHeader.className = 'section-header';
            groupHeader.innerText = group.title;
            container.appendChild(groupHeader);

            const groupCard = document.createElement('div');
            groupCard.className = 'group-card';

            group.items.forEach(pt => {
                const index = globalIndex++;
                allPoints.push(pt);

                // Уникальные ключи сохранения: Блок_Время_Параметр_Точка
                const keyCl = `${currentBlock}_${currentTime}_cl_${pt}`;
                const keyTurb = `${currentBlock}_${currentTime}_turb_${pt}`;

                const savedCl = localStorage.getItem(keyCl) || '';
                const savedTurb = localStorage.getItem(keyTurb) || '';

                const row = document.createElement('div');
                row.className = 'row';
                row.id = `row_${index}`;
                row.innerHTML = `
                    <div class="label-wrap">
                        <div class="status-dot"></div>
                        <div class="label">${pt}</div>
                    </div>
                    <div class="inputs">
                        <input type="text" inputmode="decimal" id="cl_${index}" value="${savedCl}" placeholder="Cl" oninput="checkState(${index}, '${pt}')">
                        <input type="text" inputmode="decimal" id="turb_${index}" value="${savedTurb}" placeholder="Turb" oninput="checkState(${index}, '${pt}')">
                    </div>
                `;
                groupCard.appendChild(row);
            });

            container.appendChild(groupCard);
        });

        allPoints.forEach((pt, index) => {
            checkState(index, pt);
        });

        function showAlert(message) {
            if (tg && tg.showAlert) {
                tg.showAlert(message);
            } else {
                alert(message);
            }
        }

        function checkState(index, ptName) {
            const clInput = document.getElementById(`cl_${index}`);
            const turbInput = document.getElementById(`turb_${index}`);
            if (!clInput || !turbInput) return;

            const cl = clInput.value.trim();
            const turb = turbInput.value.trim();
            const row = document.getElementById(`row_${index}`);

            if (ptName) {
                // Сохраняем в localStorage с разделением по блоку и времени
                localStorage.setItem(`${currentBlock}_${currentTime}_cl_${ptName}`, cl);
                localStorage.setItem(`${currentBlock}_${currentTime}_turb_${ptName}`, turb);
            }

            if (cl || turb) {
                row.classList.add('filled');
            } else {
                row.classList.remove('filled');
            }

            const hasData = allPoints.some((_, i) => {
                const elCl = document.getElementById(`cl_${i}`);
                const elTurb = document.getElementById(`turb_${i}`);
                return (elCl && elCl.value.trim() !== "") || (elTurb && elTurb.value.trim() !== "");
            });

            if (tg) {
                if (hasData) {
                    tg.MainButton.show();
                } else {
                    tg.MainButton.hide();
                }
            }
        }

        // 1. Проверка хлора: обязательно 2 цифры после точки/запятой и ЧЁТНОЕ последнее число
        function validateChlorine(val) {
            if (!val) return { valid: true };
            
            const str = val.replace(',', '.');
            const regex = /^(0|[1-9]\d*)\.\d{2}$/;
            if (!regex.test(str)) {
                return { valid: false, reason: "формат должен быть с двумя знаками (например: 0.22 или 1.98)" };
            }

            const lastDigit = parseInt(str.slice(-1), 10);
            if (lastDigit % 2 !== 0) {
                return { valid: false, reason: "значение хлора должно быть чётным (например: 0.22 вместо 0.21)" };
            }

            return { valid: true };
        }

        // 2. Проверка мутности: обязательно 1 цифра после точки/запятой
        function validateTurbidity(val) {
            if (!val) return { valid: true };

            const str = val.replace(',', '.');
            const regex = /^(0|[1-9]\d*)\.\d{1}$/;
            if (!regex.test(str)) {
                return { valid: false, reason: "формат должен быть с одним знаком после точки (например: 2.1, 0.9, 11.8)" };
            }

            return { valid: true };
        }

        function sendData() {
            const result = [];

            for (let index = 0; index < allPoints.length; index++) {
                const pt = allPoints[index];
                const clEl = document.getElementById(`cl_${index}`);
                const turbEl = document.getElementById(`turb_${index}`);

                const clRaw = clEl ? clEl.value.trim() : "";
                const turbRaw = turbEl ? turbEl.value.trim() : "";

                if (clRaw === "" && turbRaw === "") continue;

                const clCheck = validateChlorine(clRaw);
                if (!clCheck.valid) {
                    showAlert(`Ошибка в "${pt}" (Хлор "${clRaw}"): ${clCheck.reason}.`);
                    return;
                }

                const turbCheck = validateTurbidity(turbRaw);
                if (!turbCheck.valid) {
                    showAlert(`Ошибка в "${pt}" (Мутность "${turbRaw}"): ${turbCheck.reason}.`);
                    return;
                }

                result.push({
                    point: pt,
                    chlorine: clRaw,
                    turbidity: turbRaw
                });
            }

            if (result.length === 0) {
                showAlert("Заполните хотя бы одно поле перед отправкой!");
                return;
            }

            // Очищаем локальную память текущего блока/времени после отправки
            allPoints.forEach(pt => {
                localStorage.removeItem(`${currentBlock}_${currentTime}_cl_${pt}`);
                localStorage.removeItem(`${currentBlock}_${currentTime}_turb_${pt}`);
            });

            if (tg) {
                tg.sendData(JSON.stringify(result));
            }
        }
    </script>
</body>
</html>

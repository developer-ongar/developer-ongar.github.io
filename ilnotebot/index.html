<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ввод анализов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-secondary-bg-color, #f0f0f2);
            --card-bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --accent: var(--tg-theme-button-color, #2481cc);
            --border: rgba(60, 60, 67, 0.12);
            --dot-active: #34c759;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px 12px 32px 12px;
        }

        .header {
            margin: 0 0 16px 8px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 2px 0;
            letter-spacing: -0.4px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint);
            margin: 0;
        }

        .section-header {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--hint);
            margin: 18px 0 6px 12px;
            letter-spacing: 0.2px;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.04);
        }

        .row {
            display: flex;
            flex-direction: column;
            padding: 10px 12px;
            position: relative;
            gap: 8px;
        }

        .row:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            left: 12px;
            height: 0.5px;
            background: var(--border);
        }

        .row-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: transparent;
            transition: background 0.2s ease;
        }

        .row.filled .status-dot {
            background: var(--dot-active);
        }

        .label {
            font-size: 14px;
            font-weight: 600;
        }

        .inputs-primary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .inputs-secondary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 4px;
        }

        input {
            width: 100%;
            padding: 6px 4px;
            background: var(--bg);
            color: var(--text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: background 0.2s;
        }

        input:focus {
            background: rgba(36, 129, 204, 0.15);
        }

        input::placeholder {
            color: var(--hint);
            font-weight: 400;
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Данные анализов</h1>
        <p id="page-subtitle">Введите показания параметров</p>
    </div>

    <div id="table"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.MainButton.setText("СОХРАНИТЬ И ОТПРАВИТЬ");
            tg.MainButton.onClick(() => sendData());
        }

        const urlParams = new URLSearchParams(window.location.search);
        const currentBlock = urlParams.get('block') || 'БВО-1';
        const currentTime = urlParams.get('time') || '09:00';

        document.getElementById('page-subtitle').innerText = `Блок: ${currentBlock} | Время: ${currentTime}`;

        const groups = [
            {
                title: "Насосы",
                items: ["Насос 1", "Насос 2", "Насос 3", "Насос 4", "Насос 5", "Насос 6"]
            },
            {
                title: "Управление и коллекторы",
                items: ["УФО 1", "УФО 2", "КЧВ", "КФВ", "Общий коллектор", "После смесителя", "Исх. вода", "Оборотная вода"]
            },
            {
                title: "Фильтры",
                items: [
                    "Фильтр 1", "Фильтр 2", "Фильтр 3", "Фильтр 4", "Фильтр 5", "Фильтр 6",
                    "Фильтр 7", "Фильтр 8", "Фильтр 9", "Фильтр 10", "Фильтр 11", "Фильтр 12"
                ]
            }
        ];

        const container = document.getElementById('table');
        let globalIndex = 0;
        const allPoints = [];

        groups.forEach(group => {
            const groupHeader = document.createElement('div');
            groupHeader.className = 'section-header';
            groupHeader.innerText = group.title;
            container.appendChild(groupHeader);

            const groupCard = document.createElement('div');
            groupCard.className = 'group-card';

            group.items.forEach(pt => {
                const index = globalIndex++;
                allPoints.push(pt);

                const getVal = (field) => localStorage.getItem(`${currentBlock}_${currentTime}_${field}_${pt}`) || '';

                const row = document.createElement('div');
                row.className = 'row';
                row.id = `row_${index}`;
                row.innerHTML = `
                    <div class="row-header">
                        <div class="status-dot"></div>
                        <div class="label">${pt}</div>
                    </div>
                    <div class="inputs-primary">
                        <input type="text" inputmode="decimal" id="cl_${index}" value="${getVal('cl')}" placeholder="Хлор (Cl)" oninput="checkState(${index}, '${pt}')">
                        <input type="text" inputmode="decimal" id="turb_${index}" value="${getVal('turb')}" placeholder="Мутность" oninput="checkState(${index}, '${pt}')">
                    </div>
                    <div class="inputs-secondary">
                        <input type="text" inputmode="decimal" id="ph_${index}" value="${getVal('ph')}" placeholder="pH" oninput="checkState(${index}, '${pt}')">
                        <input type="text" inputmode="decimal" id="alk_${index}" value="${getVal('alk')}" placeholder="Щел." oninput="checkState(${index}, '${pt}')">
                        <input type="text" inputmode="decimal" id="al_${index}" value="${getVal('al')}" placeholder="Al" oninput="checkState(${index}, '${pt}')">
                        <input type="text" inputmode="decimal" id="ox_${index}" value="${getVal('ox')}" placeholder="Окисл." oninput="checkState(${index}, '${pt}')">
                    </div>
                `;
                groupCard.appendChild(row);
            });

            container.appendChild(groupCard);
        });

        allPoints.forEach((pt, index) => checkState(index, pt));

        function showAlert(message) {
            if (tg && tg.showAlert) tg.showAlert(message);
            else alert(message);
        }

        function checkState(index, ptName) {
            const fields = ['cl', 'turb', 'ph', 'alk', 'al', 'ox'];
            const vals = {};
            
            fields.forEach(f => {
                const el = document.getElementById(`${f}_${index}`);
                vals[f] = el ? el.value.trim() : '';
                if (ptName) localStorage.setItem(`${currentBlock}_${currentTime}_${f}_${ptName}`, vals[f]);
            });

            const row = document.getElementById(`row_${index}`);
            const isFilled = Object.values(vals).some(v => v !== '');
            
            if (isFilled) row.classList.add('filled');
            else row.classList.remove('filled');

            const hasAnyData = allPoints.some((_, i) => 
                fields.some(f => {
                    const el = document.getElementById(`${f}_${i}`);
                    return el && el.value.trim() !== '';
                })
            );

            if (tg) {
                if (hasAnyData) tg.MainButton.show();
                else tg.MainButton.hide();
            }
        }

        function validateChlorine(val) {
            if (!val) return { valid: true };
            const str = val.replace(',', '.');
            const regex = /^(0|[1-9]\d*)\.\d{2}$/;
            if (!regex.test(str)) {
                return { valid: false, reason: "формат должен быть с двумя знаками (например: 0.22 или 1.98)" };
            }
            const lastDigit = parseInt(str.slice(-1), 10);
            if (lastDigit % 2 !== 0) {
                return { valid: false, reason: "значение хлора должно быть чётным (например: 0.22 вместо 0.21)" };
            }
            return { valid: true };
        }

        function validateTurbidity(val) {
            if (!val) return { valid: true };
            const str = val.replace(',', '.');
            const regex = /^(0|[1-9]\d*)\.\d{1}$/;
            if (!regex.test(str)) {
                return { valid: false, reason: "формат должен быть с одним знаком после точки (например: 2.1, 0.9)" };
            }
            return { valid: true };
        }

        function sendData() {
            const result = [];
            const fields = ['cl', 'turb', 'ph', 'alk', 'al', 'ox'];

            for (let index = 0; index < allPoints.length; index++) {
                const pt = allPoints[index];
                const cl = document.getElementById(`cl_${index}`)?.value.trim() || '';
                const turb = document.getElementById(`turb_${index}`)?.value.trim() || '';
                const ph = document.getElementById(`ph_${index}`)?.value.trim() || '';
                const alk = document.getElementById(`alk_${index}`)?.value.trim() || '';
                const al = document.getElementById(`al_${index}`)?.value.trim() || '';
                const ox = document.getElementById(`ox_${index}`)?.value.trim() || '';

                if (!cl && !turb && !ph && !alk && !al && !ox) continue;

                const clCheck = validateChlorine(cl);
                if (!clCheck.valid) {
                    showAlert(`Ошибка в "${pt}" (Хлор "${cl}"): ${clCheck.reason}.`);
                    return;
                }

                const turbCheck = validateTurbidity(turb);
                if (!turbCheck.valid) {
                    showAlert(`Ошибка в "${pt}" (Мутность "${turb}"): ${turbCheck.reason}.`);
                    return;
                }

                result.push({
                    point: pt,
                    chlorine: cl,
                    turbidity: turb,
                    ph: ph,
                    alkalinity: alk,
                    aluminum: al,
                    oxidizability: ox
                });
            }

            if (result.length === 0) {
                showAlert("Заполните хотя бы одно поле перед отправкой!");
                return;
            }

            allPoints.forEach(pt => {
                fields.forEach(f => localStorage.removeItem(`${currentBlock}_${currentTime}_${f}_${pt}`));
            });

            if (tg) {
                tg.sendData(JSON.stringify(result));
            }
        }
    </script>
</body>
</html>

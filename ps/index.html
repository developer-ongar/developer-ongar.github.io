<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS5 Tournament Invitation</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:900px;
padding:40px;
text-align:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border-radius:30px;
box-shadow:0 0 40px rgba(0,0,0,.6);
}

.ps{
font-size:90px;
margin-bottom:15px;
}

h1{
font-size:55px;
color:#00eaff;
text-shadow:0 0 20px #00eaff;
margin-bottom:15px;
}

.subtitle{
font-size:22px;
margin-bottom:35px;
color:#ddd;
}

.players{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:20px;
margin-bottom:35px;
}

.player{
padding:20px;
background:rgba(255,255,255,.08);
border-radius:20px;
transition:.3s;
}

.player:hover{
transform:translateY(-8px);
background:#00eaff;
color:black;
}

.info{
font-size:20px;
color:#ddd;
margin-bottom:30px;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:25px;
}

.btn{
padding:16px 40px;
border:none;
border-radius:50px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
background:#00eaff;
}

.btn:hover{
transform:scale(1.05);
}

.danger{
background:#ff3333;
color:white;
}

#message{
margin-top:30px;
font-size:28px;
font-weight:bold;
color:#ff4444;
}

#videoBox{
display:none;
margin-top:25px;
}

iframe{
width:100%;
height:315px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,.5);
}

</style>
</head>

<body>

<div class="container">

<div class="ps">🎮</div>

<h1>PS5 TOURNAMENT</h1>

<p class="subtitle">
Легендарная битва начинается ⚡<br>
Только один станет чемпионом 👑
</p>

<div class="players">

<div class="player"><h2>Нурасыл Красавчикулы</h2></div>
<div class="player"><h2>Еркебулан Соскаулы</h2></div>
<div class="player"><h2>Акежан Атарскийулы</h2></div>
<div class="player"><h2>Дамир Самецулы</h2></div>
<div class="player"><h2>Мурагер Чемпионулы</h2></div>
<div class="player"><h2>Онгарский</h2></div>

</div>

<div class="info">

📅 Дата: ХЗ<br>
🕒 Время: НУРИК<br>
📍 Место: ОРГАНИЗУЙ<br><br>

Готовьте джойстики.<br>
Проигравших ждут оправдания и танцы 😎🔥

</div>

<div class="buttons">

<button class="btn" onclick="showSigma()">
ПРИДУ 😎
</button>

<button class="btn danger" onclick="showArmy()">
НЕ ПРИДУ 💀
</button>

</div>

<div id="message"></div>

<div id="videoBox">

<iframe
src="https://www.youtube.com/embed/frAhxXbLetk"
title="Sigma Boy"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>

</div>

</div>

<script>

function showSigma(){
document.getElementById("videoBox").style.display="block";
document.getElementById("message").innerHTML=
"😎 Sigma режим активирован";
}

function showArmy(){
document.getElementById("videoBox").style.display="none";
document.getElementById("message").innerHTML=
"📩 Повестка в военкомат уже готовится...<br><br>ВНИМАНИЕ!!! ТВои данные были отправлены. Поедешь служить жердын котындегы БЕЙНЕУГЕ!";
}

</script>

</body>
</html>
